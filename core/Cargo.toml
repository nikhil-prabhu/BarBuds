[package]
name = "barbuds-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
# Must match the `uniffi_bindgen` version pinned by the installed cargo-swift
# (cargo-swift 0.11.1 -> uniffi_bindgen =0.31.1). Bump both together.
uniffi = "=0.31.1"
thiserror = "2"
